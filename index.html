  <body>
    <!--
      CSS-only loader shell — "24-Hour Spark" load sequence.
      Pure CSS keyframe animation starting at first paint; hard cap 1.1 s.

      Sequence:
        0.00–0.48 s — Spark SVG parts assemble (.ld-part stagger)
        0.05–0.65 s — Counter counts 00 → 24; outer ring ellipse stroke draws in sync
        0.35–0.60 s — IDEA SPRINT 2026 title clips in with ease-out-expo
        0.52–0.68 s — Spark pulses (1 → 1.07 → 1); glow flares behind it (0 → 1 → 0.5)
        0.68–0.78 s — Inner content & brand label fade out (fully gone before panels move)
        0.70 s      — Loader.jsx dispatches 'loader:done' (Hero entrance triggers)
        0.70–0.78 s — Seam stripes scaleY(0 → 1) at the center split line
        0.78–1.06 s — Left and right panels split open with colored seam stripes
        1.10 s      — Hard CSS safety hide (__loaderHide); shell removed from DOM by Loader.jsx

      Fail-safes:
        • Works with pure CSS if JS is blocked; auto-hides at 1.1 s max.
        • aria-hidden="true" + pointer-events: none — hero always clickable and accessible underneath.
        • prefers-reduced-motion: reduce — #loader hidden instantly (display: none).
        • noscript: #loader hidden instantly.
    -->
    <style>
      @property --ld-n {
        syntax: '<integer>';
        inherits: false;
        initial-value: 0;
      }

      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        overflow: hidden;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: __loaderHide 0s 1.1s forwards;
      }
      @keyframes __loaderHide {
        to { visibility: hidden; }
      }

      /* ── Panels: split open 0.78–1.06 s ── */
      #loader-panel-l {
        position: absolute;
        left: 0;
        top: 0;
        width: calc(50% + 1px);
        height: 100%;
        background: #171717;
        z-index: 0;
        animation: __ldPanelL 0.28s 0.78s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      #loader-panel-l::after {
        content: '';
        position: absolute;
        right: 0;
        top: 0;
        width: 6px;
        height: 100%;
        background: #F05A28;
        transform: scaleY(0);
        transform-origin: center;
        animation: __ldStripe 0.08s 0.70s ease-out forwards;
      }
      @keyframes __ldPanelL {
        to { transform: translateX(-101%); }
      }

      #loader-panel-r {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        background: #171717;
        z-index: 0;
        animation: __ldPanelR 0.28s 0.78s cubic-bezier(0.76, 0, 0.24, 1) forwards;
      }
      #loader-panel-r::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        width: 6px;
        height: 100%;
        background: #D9F36A;
        transform: scaleY(0);
        transform-origin: center;
        animation: __ldStripe 0.08s 0.70s ease-out forwards;
      }
      @keyframes __ldPanelR {
        to { transform: translateX(101%); }
      }

      @keyframes __ldStripe {
        to { transform: scaleY(1); }
      }

      /* ── Centered content column: fade out 0.68–0.78 s before panels move ── */
      #loader-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 1;
        transform-origin: center center;
        animation: __ldInnerOut 0.10s 0.68s cubic-bezier(0.4, 0, 1, 1) forwards;
      }
      @keyframes __ldInnerOut {
        to {
          opacity: 0;
          transform: scale(1.04);
        }
      }

      /* ── Radial glow behind spark (no filter) ── */
      #loader-glow {
        position: absolute;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(240, 90, 40, 0.35), transparent 65%);
        pointer-events: none;
        z-index: 0;
        top: calc(clamp(120px, 30vw, 200px) / 2);
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: __ldGlow 0.16s 0.52s ease-in-out forwards;
      }
      @keyframes __ldGlow {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
        50%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
        100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
      }

      /* ── Spark container ── */
      #loader-spark {
        position: relative;
        width: clamp(120px, 30vw, 200px);
        height: clamp(120px, 30vw, 200px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        animation: __ldSparkPulse 0.16s 0.52s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }
      @keyframes __ldSparkPulse {
        0%   { transform: scale(1); }
        50%  { transform: scale(1.07); }
        100% { transform: scale(1); }
      }

      /* ── Shared part animation ── */
      .ld-part {
        transform-box: fill-box;
        transform-origin: center;
        opacity: 0;
        animation: __ldPart 0.30s var(--d, 0s) cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes __ldPart {
        from {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(0.6);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      /* Outer ring stroke drawing synced with counter 0.05–0.65 s */
      #ls-ring-outer {
        animation: __ldRing 0.60s 0.05s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes __ldRing {
        from { stroke-dashoffset: 1; }
        to   { stroke-dashoffset: 0; }
      }

      /* ── 24 HRS counter ── */
      #loader-counter {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 0.35em;
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-size: 1.15rem;
        letter-spacing: 0.2em;
        font-variant-numeric: tabular-nums;
        color: #D9F36A;
        width: 7.5rem;
        contain: layout paint;
        text-align: center;
        animation: __ldCounterFade 0.06s 0.68s ease-out forwards;
      }
      #loader-count {
        counter-reset: ld var(--ld-n);
        animation: __ldCount 0.60s 0.05s cubic-bezier(0.4, 0, 0.2, 1) both;
      }
      #loader-count::before {
        content: counter(ld, decimal-leading-zero);
      }
      @keyframes __ldCount {
        to { --ld-n: 24; }
      }
      @keyframes __ldCounterFade {
        to { opacity: 0; }
      }

      /* ── Loader title: IDEA SPRINT 2026 ── */
      #loader-title {
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: clamp(1.75rem, 8vw, 4.25rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 0.92;
        color: #F2EBDD;
        text-align: center;
        clip-path: inset(0 0 100% 0);
        transform: translateY(6px);
        animation: __ldTitleIn 0.25s 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes __ldTitleIn {
        to {
          clip-path: inset(0 0 0% 0);
          transform: translateY(0);
        }
      }

      /* ── Brand label: IEDC BOOTCAMP CEC ── */
      #loader-brand {
        position: absolute;
        bottom: max(1.5rem, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-size: clamp(0.7rem, 2vw, 0.85rem);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #F2EBDD;
        opacity: 0.6;
        z-index: 1;
        white-space: nowrap;
        animation: __ldBrandOut 0.10s 0.68s cubic-bezier(0.4, 0, 1, 1) forwards;
      }
      @keyframes __ldBrandOut {
        to {
          opacity: 0;
          transform: translateX(-50%) scale(1.04);
        }
      }

      /* Reduced-motion: skip loader entirely */
      @media (prefers-reduced-motion: reduce) {
        #loader { display: none !important; }
      }
    </style>
    <noscript>
      <style>#loader { display: none !important; }</style>
    </noscript>

    <div id="loader" aria-hidden="true" role="presentation">
      <div id="loader-panel-l"></div>
      <div id="loader-panel-r"></div>
      <div id="loader-inner">
        <div id="loader-glow"></div>
        <div id="loader-spark">
          <svg width="100%" height="100%" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="overflow:visible; display:block">
            <defs>
              <linearGradient id="lg-cg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F05A28"/>
                <stop offset="100%" stop-color="#c43e12"/>
              </linearGradient>
              <linearGradient id="lg-rg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#D9F36A"/>
                <stop offset="100%" stop-color="#a8c73e"/>
              </linearGradient>
            </defs>

            <!-- #ls-ring: both ellipses -->
            <g id="ls-ring" class="ld-part" style="--dx:-60px; --dy:-40px; --r:-40deg; --d:0s">
              <ellipse id="ls-ring-outer" cx="60" cy="62" rx="34" ry="12" transform="rotate(-18 60 62)" fill="none" stroke="url(#lg-rg)" stroke-width="3" opacity="0.7" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>
              <ellipse cx="60" cy="52" rx="18" ry="6" transform="rotate(10 60 52)" fill="none" stroke="url(#lg-rg)" stroke-width="2" opacity="0.5"/>
            </g>

            <!-- #ls-disc -->
            <g id="ls-disc" class="ld-part" style="--dx:60px; --dy:50px; --r:0deg; --d:0.04s">
              <circle cx="78" cy="72" r="10" fill="#F2EBDD" opacity="0.5"/>
            </g>

            <!-- #ls-left -->
            <g id="ls-left" class="ld-part" style="--dx:-70px; --dy:30px; --r:-20deg; --d:0.08s">
              <polygon points="30,36 60,52 60,84 30,68" fill="#c43e12" opacity="0.9"/>
            </g>

            <!-- #ls-right -->
            <g id="ls-right" class="ld-part" style="--dx:70px; --dy:30px; --r:20deg; --d:0.12s">
              <polygon points="60,52 90,36 90,68 60,84" fill="#F05A28" opacity="0.75"/>
            </g>

            <!-- #ls-top -->
            <g id="ls-top" class="ld-part" style="--dx:0px; --dy:-70px; --r:0deg; --d:0.16s">
              <polygon points="60,20 90,36 60,52 30,36" fill="url(#lg-cg)" opacity="0.95"/>
            </g>

            <!-- #ls-dots: three small circles -->
            <g id="ls-dots" class="ld-part" style="--dx:0px; --dy:0px; --r:0deg; --d:0.18s">
              <circle cx="22" cy="42" r="2.5" fill="#D9F36A" opacity="0.7"/>
              <circle cx="102" cy="38" r="2" fill="#F05A28" opacity="0.6"/>
              <circle cx="92" cy="80" r="3" fill="#D9F36A" opacity="0.5"/>
            </g>
          </svg>
        </div>
        <div id="loader-counter">
          <span id="loader-count"></span> HRS
        </div>
        <div id="loader-title">IDEA SPRINT<br/>2026</div>
      </div>
      <div id="loader-brand">IEDC BOOTCAMP CEC</div>
    </div>
    <script>window.__ldT0=performance.now()</script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
