  <body>
    <!--
      CSS-only loader shell — plan section B, T17 (revised T19 follow-up #3).
      Painted synchronously before React mounts.

      Sequence (driven by GSAP in Loader.jsx once React mounts):
        0.00 s — IEDC BOOTCAMP CEC fades in (the brand)
        0.20 s — bar draws
        0.35 s — IEDC BOOTCAMP CEC fades out, IDEA SPRINT 2026 clips in
        0.60 s — Spark SVG pulses in
        0.75 s — entire overlay clips upward out
        Total: ≤ 1.0 s (T22 LCP optimised)

      Pure CSS fallback (no JS): same states appear via CSS animation,
      overlay self-hides at 1.1 s max via __loaderHide.
      aria-hidden + pointer-events:none — hero always reachable underneath.
      prefers-reduced-motion: overlay hidden immediately (display:none).
      noscript: overlay hidden immediately.
    -->
    <style>
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #171717;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0;
        pointer-events: none;
        overflow: hidden;
        /* Pure-CSS safety: hide at 1.1 s max even if JS never fires (T22) */
        animation: __loaderHide 0s 1.1s forwards;
      }
      @keyframes __loaderHide {
        to { visibility: hidden; pointer-events: none; }
      }
      /* Inner wrapper — GSAP applies clip-path on this for the wipe-out */
      #loader-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        will-change: transform, clip-path;
      }

      /* ── IEDC brand label (shown first) ── */
      #loader-brand {
        font-family: 'Space Grotesk', 'Helvetica Neue', sans-serif;
        font-size: clamp(0.7rem, 2vw, 0.9rem);
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #F2EBDD;
        opacity: 0;
        /* CSS fallback entrance */
        animation: __loaderBrandIn 0.25s 0.05s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes __loaderBrandIn { to { opacity: 0.5; } }

      /* ── Orange separator bar ── */
      #loader-bar {
        width: clamp(2.5rem, 12vw, 5rem);
        height: 2px;
        background: #F05A28;
        transform-origin: left;
        transform: scaleX(0);
        animation: __loaderBar 0.35s 0.22s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes __loaderBar { to { transform: scaleX(1); } }

      /* ── Main title: IDEA SPRINT 2026 ── */
      #loader-title {
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: clamp(2rem, 10vw, 5rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 0.88;
        color: #F2EBDD;
        text-align: center;
        clip-path: inset(0 0 100% 0);
        /* CSS fallback: clip reveals after bar */
        animation: __loaderTitleIn 0.30s 0.42s cubic-bezier(0.16,1,0.3,1) forwards;
      }
      @keyframes __loaderTitleIn { to { clip-path: inset(0 0 0% 0); } }

      /* ── Spark SVG container ── */
      #loader-spark {
        opacity: 0;
        transform: scale(0.5);
        animation: __loaderSparkIn 0.22s 0.62s cubic-bezier(0.34,1.56,0.64,1) forwards;
      }
      @keyframes __loaderSparkIn { to { opacity: 0.85; transform: scale(1); } }

      /* Reduced-motion: skip loader entirely */
      @media (prefers-reduced-motion: reduce) {
        #loader { display: none !important; }
      }
    </style>
    <noscript>
      <style>#loader { display: none !important; }</style>
    </noscript>

    <div id="loader" aria-hidden="true" role="presentation">
      <div id="loader-inner">
        <div id="loader-brand">IEDC BOOTCAMP CEC</div>
        <div id="loader-bar"></div>
        <div id="loader-title">IDEA SPRINT<br/>2026</div>
        <!-- Inline SVG spark (no chunk load) -->
        <div id="loader-spark" aria-hidden="true">
          <svg width="56" height="56" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
            <defs>
              <linearGradient id="lg-cg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F05A28"/>
                <stop offset="100%" stop-color="#c43e12"/>
              </linearGradient>
              <linearGradient id="lg-rg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#D9F36A"/>
                <stop offset="100%" stop-color="#a8c73e"/>
              </linearGradient>
              <filter id="lg-glow" x="-40%" y="-40%" width="180%" height="180%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <ellipse cx="60" cy="62" rx="34" ry="12" transform="rotate(-18 60 62)" fill="none" stroke="url(#lg-rg)" stroke-width="3" opacity="0.7"/>
            <circle cx="78" cy="72" r="10" fill="#F2EBDD" opacity="0.5"/>
            <polygon points="60,20 90,36 60,52 30,36" fill="url(#lg-cg)" opacity="0.95" filter="url(#lg-glow)"/>
            <polygon points="30,36 60,52 60,84 30,68" fill="#c43e12" opacity="0.9"/>
            <polygon points="60,52 90,36 90,68 60,84" fill="#F05A28" opacity="0.75"/>
            <ellipse cx="60" cy="52" rx="18" ry="6" transform="rotate(10 60 52)" fill="none" stroke="url(#lg-rg)" stroke-width="2" opacity="0.5"/>
            <circle cx="22" cy="42" r="2.5" fill="#D9F36A" opacity="0.7"/>
            <circle cx="102" cy="38" r="2" fill="#F05A28" opacity="0.6"/>
            <circle cx="92" cy="80" r="3" fill="#D9F36A" opacity="0.5"/>
          </svg>
        </div>
      </div>
    </div>
